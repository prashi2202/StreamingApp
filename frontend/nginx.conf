server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /socket.io/ {
        proxy_pass http://chat:3004/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://auth:3001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /streaming-api/ {
        rewrite ^/streaming-api/(.*)$ /$1 break;
        proxy_pass http://streaming:3002;
        proxy_set_header Host $host;
    }

    location /streaming-public/ {
        rewrite ^/streaming-public/(.*)$ /$1 break;
        proxy_pass http://streaming:3002;
        proxy_set_header Host $host;
    }

    location /admin-api/ {
        rewrite ^/admin-api/(.*)$ /$1 break;
        proxy_pass http://admin:3003;
        proxy_set_header Host $host;
    }

    location /chat-api/ {
        rewrite ^/chat-api/(.*)$ /$1 break;
        proxy_pass http://chat:3004;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
